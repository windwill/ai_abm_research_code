[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-transition-abm"
version = "1.0.0"
description = "Agent based model for AI transition calibration and scenario analysis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
yaml = ["PyYAML"]
test = ["pytest"]

[project.scripts]
ai-abm = "abm_ai.cli:main"
ai-abm-scenarios = "abm_ai.scenarios:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
